services:
  app:
    build: .
    restart: unless-stopped
    # El CMD de la imagen aplica migraciones y seed antes de levantar el
    # servidor (D11), así que sólo necesita a Postgres listo.
    depends_on:
      postgres:
        condition: service_healthy
    # Sin `ports`: el Caddy compartido del servidor llega por la red `proxy`
    # (D22). Publicar al host saltaría las reglas de ufw.
    networks:
      default:
      proxy:
        aliases:
          - multiblog-app
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-multiblog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-multiblog}
      MEDIA_DIR: /data/media
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - media_data:/data/media

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multiblog}
      POSTGRES_USER: ${POSTGRES_USER:-multiblog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multiblog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: sólo para pruebas locales completas contra *.localhost (D3).
  # En producción el borde es el Caddy compartido del servidor (D22) — este
  # servicio no arranca salvo que se pida explícitamente con
  # `docker compose --profile local-caddy up`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["local-caddy"]
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

# Red compartida con el Caddy del servidor. Se crea una vez a mano:
# `docker network create proxy` (también hace falta en local para `up`).
networks:
  proxy:
    external: true

volumes:
  caddy_data:
  postgres_data:
  media_data:
